<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,Helvetica,sans-serif}.captions{position:absolute;left:5%;right:5%;bottom:7%;display:flex;flex-direction:column;align-items:center;gap:8px}.line{max-width:90%;padding:10px 18px;border-radius:8px;background:rgba(0,0,0,.76);border:2px solid #ff5964;color:white;text-align:center;font-size:clamp(22px,2.6vw,40px);line-height:1.25;text-shadow:0 2px 2px #000;animation:appear .16s ease-out}.speaker{color:#7fe6d5;font-weight:700}.interim{opacity:.78}.translation-state{display:block;margin-top:3px;font-size:.58em;opacity:.72}@keyframes appear{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
</style></head><body><div class="captions" id="captions"></div><script>
const lines=[];let interim=null,interimTimer=null,translatedMode=false,speakerColors={'1':'#ff5964','2':'#ff9f43','3':'#d789ff','4':'#ffd166','5':'#ff7892','6':'#e6a3ff'};const translations=new Map(),translationErrors=new Map(),root=document.getElementById('captions');let displaySeconds=9,alignment='center',bubbleColor='#000000',borderColor='#ff5964';function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){root.innerHTML='';for(const item of [...lines,...(interim?[interim]:[])]){const el=document.createElement('div');el.className='line'+(item.interim?' interim':'');const color=speakerColors[item.speakerId]||speakerColors['1'];el.style.backgroundColor=bubbleColor+'cc';el.style.border='2px solid '+borderColor;el.style.textAlign=alignment;const hasTranslation=translatedMode&&item.id&&translations.has(item.id);const text=hasTranslation?translations.get(item.id):item.text;const state=translatedMode&&item.id?(hasTranslation?'':translationErrors.has(item.id)?'traduction indisponible':'traduction…'):'';el.innerHTML=`<span class="speaker" style="color:${esc(color)}">${esc(item.speaker)}</span> ${esc(text)}${state?`<small class="translation-state">${esc(state)}</small>`:''}`;root.append(el)}}function transcript(data){const alt=data?.channel?.alternatives?.[0]||data?.results?.channels?.[0]?.alternatives?.[0];if(!alt?.transcript)return;const sp=alt.words?.find(w=>w.speaker!==undefined)?.speaker,speakerId=sp===undefined?'1':String(Number(sp)+1);const item={id:data._translationId||'',speakerId,speaker:sp===undefined?'Voix':`Locuteur ${speakerId}`,text:alt.transcript};if(data.is_final){if(interimTimer)clearTimeout(interimTimer);interim=null;lines.push(item);while(lines.length>3){const oldest=lines.shift();clearTimeout(oldest.timer);if(oldest.id){translations.delete(oldest.id);translationErrors.delete(oldest.id)}}scheduleExpiration(item)}else{item.interim=true;interim=item;if(interimTimer)clearTimeout(interimTimer);interimTimer=setTimeout(()=>{if(interim===item){interim=null;render()}},displaySeconds*1000)}render()}function scheduleExpiration(item){clearTimeout(item.timer);item.timer=setTimeout(()=>{const index=lines.indexOf(item);if(index!==-1){lines.splice(index,1);if(item.id){translations.delete(item.id);translationErrors.delete(item.id)}render()}},displaySeconds*1000)}function applyOverlaySettings(settings){if(['left','center','right'].includes(settings.alignment))alignment=settings.alignment;if(['left','center','right'].includes(settings.alignment))root.style.alignItems=settings.alignment==='left'?'flex-start':settings.alignment==='right'?'flex-end':'center';if(['left','center','right'].includes(settings.alignment))root.style.textAlign=settings.alignment;if(/^#[0-9a-f]{6}$/i.test(settings.bubbleColor||''))bubbleColor=settings.bubbleColor;if(/^#[0-9a-f]{6}$/i.test(settings.borderColor||''))borderColor=settings.borderColor;const seconds=Number(settings.displaySeconds);if(Number.isInteger(seconds)&&seconds>=3&&seconds<=60)displaySeconds=seconds;lines.forEach(scheduleExpiration);if(interim){clearTimeout(interimTimer);interimTimer=setTimeout(()=>{if(interim){interim=null;render()}},displaySeconds*1000)}render()}function clearCaptions(){lines.forEach(item=>clearTimeout(item.timer));lines.length=0;clearTimeout(interimTimer);interim=null;translations.clear();translationErrors.clear();render()}function connect(){const ws=new WebSocket(`ws://${location.host}/ws/overlay`);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='settings'){speakerColors={...speakerColors,...(m.colors||{})};render()}else if(m.type==='overlay_settings'){applyOverlaySettings(m)}else if(m.type==='transcription_stopped'){clearCaptions()}else if(m.type==='translation_mode'){translatedMode=Boolean(m.enabled);render()}else if(m.type==='translation'){const id=String(m.id);translations.set(id,String(m.text||''));translationErrors.delete(id);render()}else if(m.type==='translation_error'){translationErrors.set(String(m.id),'error');render()}else if(m.type==='transcript')transcript(m.data)};ws.onclose=()=>setTimeout(connect,1200)}connect();
</script></body></html>
