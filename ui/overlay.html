<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,Helvetica,sans-serif}.captions{position:absolute;left:5%;right:5%;bottom:7%;display:flex;flex-direction:column;align-items:center;gap:8px}.line{max-width:90%;padding:10px 18px;border-radius:8px;background:rgba(0,0,0,.76);color:white;text-align:center;font-size:clamp(22px,2.6vw,40px);line-height:1.25;text-shadow:0 2px 2px #000;animation:appear .16s ease-out}.speaker{color:#7fe6d5;font-weight:700}.interim{opacity:.78}@keyframes appear{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
</style></head><body><div class="captions" id="captions"></div><script>
const lines=[];let interim=null,interimTimer=null,speakerColors={'1':'#ff5964','2':'#ff9f43','3':'#d789ff','4':'#ffd166','5':'#ff7892','6':'#e6a3ff'};const root=document.getElementById('captions'),DISPLAY_MS=9000;function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){root.innerHTML='';for(const item of [...lines,...(interim?[interim]:[])]){const el=document.createElement('div');el.className='line'+(item.interim?' interim':'');const color=speakerColors[item.speakerId]||speakerColors['1'];el.innerHTML=`<span class="speaker" style="color:${esc(color)}">${esc(item.speaker)}</span> ${esc(item.text)}`;root.append(el)}}function transcript(data){const alt=data?.channel?.alternatives?.[0]||data?.results?.channels?.[0]?.alternatives?.[0];if(!alt?.transcript)return;const sp=alt.words?.find(w=>w.speaker!==undefined)?.speaker,speakerId=sp===undefined?'1':String(Number(sp)+1);const item={speakerId,speaker:sp===undefined?'Voix':`Locuteur ${speakerId}`,text:alt.transcript};if(data.is_final){if(interimTimer)clearTimeout(interimTimer);interim=null;lines.push(item);while(lines.length>3){const oldest=lines.shift();clearTimeout(oldest.timer)}item.timer=setTimeout(()=>{const index=lines.indexOf(item);if(index!==-1){lines.splice(index,1);render()}},DISPLAY_MS)}else{item.interim=true;interim=item;if(interimTimer)clearTimeout(interimTimer);interimTimer=setTimeout(()=>{if(interim===item){interim=null;render()}},DISPLAY_MS)}render()}function connect(){const ws=new WebSocket(`ws://${location.host}/ws/overlay`);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='settings'){speakerColors={...speakerColors,...(m.colors||{})};render()}else if(m.type==='transcript')transcript(m.data)};ws.onclose=()=>setTimeout(connect,1200)}connect();
</script></body></html>
